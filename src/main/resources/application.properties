spring.application.name=furima-c

# ポート設定
server.port=8080

# データベース接続設定 (環境変数DATABASE_URLがあればそれを使い、なければローカル環境)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Flyway設定
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# MyBatis設定
mybatis.configuration.map-underscore-to-camel-case=true

# Basic認証用の共通IDとパスワード（環境変数から取得）
basic.auth.enabled=${BASIC_AUTH_ENABLED:false}
basic.auth.username=${BASIC_AUTH_USER:admin}
basic.auth.password=${BASIC_AUTH_PASSWORD:2222}

# Pay.jp設定
payjp.secret-key=${PAYJP_SECRET_KEY:dummy_secret_key}
payjp.public-key=${PAYJP_PUBLIC_KEY:dummy_public_key}

# 1ファイルの最大サイズ（例：10MB）
spring.servlet.multipart.max-file-size=10MB
# 1回のリクエスト全体の最大サイズ（例：10MB）
spring.servlet.multipart.max-request-size=10MB