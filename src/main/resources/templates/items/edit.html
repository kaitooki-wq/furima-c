<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <title>商品編集 - Furima</title>
  <!-- cssは商品出品のものを併用しています: /css/items/new.css -->
  <link rel="stylesheet" href="/css/application.css">
  <link rel="stylesheet" href="/css/shared/errors.css">
  <link rel="stylesheet" href="/css/shared/form.css">
  <link rel="stylesheet" href="/css/items/new.css">
</head>
<body>
<div class="items-sell-contents">
  <header class="items-sell-header">
    <a href="/"><img src="/images/furima-logo-color.png" alt="FURIMA" class="second-logo"></a>
  </header>
  <div class="items-sell-main">
    <h2 class="items-sell-title">商品の情報を編集</h2>

    <!-- formのactionとth:objectを設定しましょう。 -->
    <form th:action="@{/items/{id}/edit(id=*{id})}" th:object="${itemForm}" method="post" enctype="multipart/form-data">
      
      <!-- IDを維持する -->
      <input type="hidden" th:field="*{id}" />

      <!-- エラーメッセージを表示できるようにしましょう。 -->
       <div class="error-alert" th:if="${#fields.hasErrors('*')}">
        <ul>
          <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
        </ul>
      </div>

      <!-- 出品画像 -->
      <div class="img-upload">
        <div class="weight-bold-text">出品画像 <span class="indispensable">必須</span></div>
        <div class="click-upload">
          <p>クリックしてファイルをアップロード</p>
          <input type="file" name="image" id="item-image" multiple accept="image/*">
        </div>
        <div id="image-list"></div>
      </div>

      <!-- 商品名と商品説明 -->
      <div class="new-items">
        <div class="weight-bold-text">商品名 <span class="indispensable">必須</span></div>
        <textarea th:field="*{name}" class="items-text" maxlength="40"></textarea>
        <div class="items-explain">
          <div class="weight-bold-text">商品の説明 <span class="indispensable">必須</span></div>
          <textarea th:field="*{description}" class="items-text" rows="7" maxlength="1000"></textarea>
        </div>
      </div>

      <!-- 商品の詳細 -->
      <div class="items-detail">
        <div class="weight-bold-text">商品の詳細</div>
        <div class="form">
          <div class="weight-bold-text">カテゴリー <span class="indispensable">必須</span></div>
          <select th:field="*{categoryId}" class="select-box">
            <option value="">---</option>
            <option value="1">レディース</option>
            <option value="2">メンズ</option>
            <option value="3">ベビー・キッズ</option>
            <option value="4">インテリア・住まい・小物</option>
            <option value="5">本・音楽・ゲーム</option>
            <option value="6">おもちゃ・ホビー・グッズ</option>
            <option value="7">家電・スマホ・カメラ</option>
            <option value="8">スポーツ・レジャー</option>
            <option value="9">ハンドメイド</option>
            <option value="10">その他</option>
          </select>
          <div class="weight-bold-text">商品の状態 <span class="indispensable">必須</span></div>
          <select th:field="*{condition}" class="select-box">
            <option value="">---</option>
            <option value="1">新品・未使用</option>
            <option value="2">未使用に近い</option>
            <option value="3">目立った傷や汚れなし</option>
            <option value="4">やや傷や汚れあり</option>
            <option value="5">傷や汚れあり</option>
            <option value="6">全体的に状態が悪い</option>
          </select>
        </div>
      </div>

      <!-- 配送について -->
      <div class="items-detail">
        <div class="weight-bold-text">配送について</div>
        <div class="form">
          <div class="weight-bold-text">配送料の負担 <span class="indispensable">必須</span></div>
          <select th:field="*{shippingPayer}" class="select-box">
            <option value="">---</option>
            <option value="1">着払い(購入者負担)</option>
            <option value="2">送料込み(出品者負担)</option>
          </select>
          <div class="weight-bold-text">発送元の地域 <span class="indispensable">必須</span></div>
          <select th:field="*{prefectureId}" class="select-box">
            <option value="">---</option>
            <option value="1">北海道</option>
            <option value="13">東京都</option>
            <option value="27">大阪府</option>
            <option value="47">沖縄県</option>
          </select>
          <div class="weight-bold-text">発送までの日数 <span class="indispensable">必須</span></div>
          <select th:field="*{shippingDays}" class="select-box">
            <option value="">---</option>
            <option value="1">1~2日で発送</option>
            <option value="2">2~3日で発送</option>
            <option value="3">4~7日で発送</option>
          </select>
        </div>
      </div>

      <!-- 販売価格 -->
      <div class="sell-price">
        <div class="weight-bold-text question-text">
          <span>販売価格（¥300〜9,999,999）</span>
        </div>
        <div>
          <div class="price-content">
            <div class="price-text">
              <span>価格</span>
              <span class="indispensable">必須</span>
            </div>
            <span class="sell-yen">¥</span>
            <input th:field="*{price}" type="text" class="price-input" id="item-price" placeholder="例）300">
          </div>
          <div class="price-content">
            <span>販売手数料 (10%)</span>
            <span><span id="add-tax-price"></span>円</span>
          </div>
          <div class="price-content">
            <span>販売利益</span>
            <span><span id="profit"></span>円</span>
          </div>
        </div>
      </div>

      <div class="sell-btn-contents">
        <button type="submit" class="sell-btn">変更する</button>
        <a th:href="@{/items/{id}(id=*{id})}" class="back-btn">もどる</a>
      </div>
    </form>
  </div>

  <div th:replace="~{shared/footer :: items-footer}"></div>
</div>
<script src="/js/item_price.js"></script>
</body>
</html>
